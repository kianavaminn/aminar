<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="robots" content="noindex, nofollow"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Our Story — Aminar</title>
<link rel="icon" type="image/png" sizes="32x32" href="images/brand/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="images/brand/favicon-192.png">
<link rel="apple-touch-icon" href="images/brand/apple-touch-icon.png">
<meta name="theme-color" content="#0d0b09">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Aminar">
<meta property="og:title" content="Our Story — Aminar">
<meta property="og:description" content="Since 1993, Aminar has blended oud and fragrance in Bangkok. Our story and our craft.">
<meta property="og:url" content="https://kianavaminn.github.io/aminar/our-story.html">
<meta property="og:image" content="https://kianavaminn.github.io/aminar/images/brand/share.jpg">
<meta property="og:image:width" content="1200"><meta property="og:image:height" content="630">

<meta name="description" content="Since 1993, Aminar has blended oud and fragrance in Bangkok. Our story and our craft.">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500&family=Marcellus&family=Jost:wght@400;500&family=Cormorant+Garamond:ital,wght@0,300;1,300;1,400&family=Italiana&family=Aref+Ruqaa:wght@400;700&family=Syncopate:wght@400;700&family=Gloock&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{--ground:#0d0b09;--text:#efe6d6;--soft:#c3b7a2;--gold:#d5b36e;--foil:#e2b43c;--ink:#16120d;--stroke:rgba(226,180,60,.6)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--ground);color:var(--text);font:400 17px/1.75 Jost,sans-serif;-webkit-font-smoothing:antialiased}
img{display:block;max-width:100%}
.m{padding-left:20px;padding-right:20px}
.nav{height:64px;display:flex;align-items:center;justify-content:center;position:absolute;inset:0 0 auto;z-index:9}
.nav img{height:24px}
.nav{justify-content:space-between;padding:0 20px}
.back{color:var(--text);text-decoration:none;font:500 14px Jost;min-height:44px;display:inline-flex;align-items:center}
.back:hover{color:var(--foil)}
.kicker{font:500 13px/1.4 Jost;letter-spacing:.22em;text-transform:uppercase;color:var(--foil)}
.p{color:var(--soft);max-width:46ch;margin-left:auto;margin-right:auto}
.p + .p{margin-top:16px}
.btn{display:inline-flex;align-items:center;min-height:54px;padding:0 26px;background:var(--gold);color:var(--ink);font:500 15px Jost;letter-spacing:.14em;text-transform:uppercase}
@media (prefers-reduced-motion:no-preference){[data-rise]{opacity:0;transform:translateY(26px);transition:opacity 1s cubic-bezier(.2,.7,.2,1),transform 1s cubic-bezier(.2,.7,.2,1)}[data-rise].in{opacity:1;transform:none}}
/* layout = option 2 (approved) */
.hero{position:relative;height:100svh;overflow:hidden;display:flex;align-items:flex-end}
.hero > img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero .t{position:relative;padding:0 20px 56px;width:100%}
@media (max-width:899px){.hero > img{object-position:50% 30%;transform:scale(1.5)}}
.her{padding-top:100px;text-align:center}
.panel{display:grid}
.panel > img{width:100%;aspect-ratio:3/3.6;object-fit:cover}
.panel .t{padding:40px 20px 70px;position:relative}
.close{padding:110px 20px 120px;text-align:center}
@media (min-width:900px){
  .m{padding-left:64px;padding-right:64px}
  .nav{height:84px}.nav img{height:30px}
  .hero .t{padding:0 64px 72px;max-width:820px}
  .her{padding-top:170px}
  .panels{margin-top:150px}
  .panel{grid-template-columns:1fr 1fr;min-height:92svh}
  .panel > img{height:100%;aspect-ratio:auto}
  .panel .t{display:flex;flex-direction:column;justify-content:center;padding:64px 7vw}
  .panel:nth-child(even) > img{order:2}
  .close{padding:170px 64px}
}

/* ---------- 0. as it is now ---------- */
.t0 .h1 span{display:block;text-transform:uppercase;line-height:.9}
.t0 .h1 .a{font:500 15vw/.9 Cinzel,serif;color:transparent;-webkit-text-stroke:1.5px var(--stroke)}
.t0 .h1 .b{font:500 15vw/.9 Cinzel,serif;color:var(--foil)}
.t0 .h1 .c{font:400 14px/1 Marcellus;letter-spacing:.5em;margin-top:16px}
.t0 .h2{font:400 9vw/1.15 Marcellus,serif;text-transform:uppercase;max-width:24ch;margin:18px auto 26px}
.t0 .h2 em{font-style:normal;color:var(--foil)}
.t0 .word{font:500 22vw/.8 Cinzel,serif;display:block;margin-bottom:22px;color:transparent;-webkit-text-stroke:1.5px var(--stroke)}
.t0 .name{font:500 26px/1.1 Cinzel,serif;text-transform:uppercase}
.t0 .h3{font:400 9vw/1.15 Marcellus,serif;text-transform:uppercase;margin:16px auto 30px;max-width:20ch}.t0 .h3 em{font-style:normal;color:var(--foil)}
@media (min-width:900px){.t0 .h1 .a,.t0 .h1 .b{font-size:7vw}.t0 .h1 .c{font-size:20px}.t0 .h2,.t0 .h3{font-size:3.6vw}.t0 .word{font-size:10vw;-webkit-text-stroke:2px var(--stroke)}.t0 .name{font-size:34px}}

/* ---------- 1. The letter: a light italic serif, lowercase, like a handwritten note ---------- */
.t1 .h1{font:300 italic 19vw/.86 "Cormorant Garamond",serif;letter-spacing:-.02em}
.t1 .h1 em{color:var(--foil)}
.t1 .h2{font:300 italic 11vw/1.05 "Cormorant Garamond",serif;max-width:16ch;margin:18px auto 26px}
.t1 .h2 em{color:var(--foil)}
.t1 .word{font:300 italic 25vw/.8 "Cormorant Garamond",serif;color:var(--foil);display:block;margin-bottom:10px}
.t1 .name{font:500 13px/1.4 Jost;letter-spacing:.24em;text-transform:uppercase;color:var(--text)}
.t1 .h3{font:300 italic 12vw/1 "Cormorant Garamond",serif;margin:12px auto 30px}.t1 .h3 em{color:var(--foil)}
@media (min-width:900px){.t1 .h1{font-size:9.4vw}.t1 .h2{font-size:5vw}.t1 .word{font-size:11vw}.t1 .h3{font-size:5.4vw}}

/* ---------- 2. Couture: hairline capitals, very wide, like a Paris fashion house ---------- */
.t2 .h1{font:400 13vw/1.02 Italiana,serif;letter-spacing:.08em;text-transform:uppercase}
.t2 .h1 em{font-style:normal;color:var(--foil)}
.t2 .h2{font:400 8vw/1.2 Italiana,serif;letter-spacing:.1em;text-transform:uppercase;max-width:22ch;margin:18px auto 26px}
.t2 .h2 em{font-style:normal;color:var(--foil)}
.t2 .word{font:400 18vw/.9 Italiana,serif;letter-spacing:.14em;text-transform:uppercase;color:var(--foil);display:block;margin-bottom:18px}
.t2 .name{font:400 18px/1.3 Italiana,serif;letter-spacing:.32em;text-transform:uppercase}
.t2 .h3{font:400 8vw/1.2 Italiana,serif;letter-spacing:.1em;text-transform:uppercase;margin:14px auto 30px}.t2 .h3 em{font-style:normal;color:var(--foil)}
@media (min-width:900px){.t2 .h1{font-size:6vw}.t2 .h2,.t2 .h3{font-size:3.4vw}.t2 .word{font-size:8.6vw}.t2 .name{font-size:22px}}

/* ---------- 3. The Gulf: an Arabic word in gold calligraphy behind each English title ---------- */
.t3 .ar{font-family:"Aref Ruqaa",serif;font-weight:700;color:var(--foil);direction:rtl;line-height:1.5;display:block;margin-bottom:6px}
.t3 .word{display:block;line-height:1.5!important;margin-bottom:10px!important}
.t3 .h1 .ar{font-size:24vw}
.t3 .h1 .en{display:block;font:400 26px/1.2 Marcellus,serif;letter-spacing:.3em;text-transform:uppercase}
.t3 .hero .t{text-align:right}
.t3 .h2{font:400 26px/1.3 Marcellus,serif;letter-spacing:.24em;text-transform:uppercase;margin:6px auto 26px}
.t3 .h2 em{font-style:normal;color:var(--foil)}
.t3 .her .ar{font-size:20vw}
.t3 .word{font-size:28vw;margin-bottom:6px}
.t3 .name{font:400 22px/1.3 Marcellus,serif;letter-spacing:.24em;text-transform:uppercase}
.t3 .h3{font:400 26px/1.3 Marcellus,serif;letter-spacing:.24em;text-transform:uppercase;margin:6px auto 30px}.t3 .h3 em{font-style:normal;color:var(--foil)}
.t3 .close .ar{font-size:18vw}
@media (min-width:900px){.t3 .hero .t{max-width:none}.t3 .h1 .ar{font-size:12vw}.t3 .h1 .en{font-size:34px}.t3 .her .ar,.t3 .close .ar{font-size:8vw}.t3 .h2,.t3 .h3{font-size:34px}.t3 .word{font-size:11vw}.t3 .name{font-size:28px}}

/* ---------- 4. The modern house: wide heavy capitals, solid gold, no outlines ---------- */
.t4 .h1{font:700 11vw/1.04 Syncopate,sans-serif;text-transform:uppercase;letter-spacing:.02em}
.t4 .h1 em{font-style:normal;color:var(--foil)}
.t4 .h2{font:400 6.4vw/1.3 Syncopate,sans-serif;text-transform:uppercase;max-width:22ch;margin:18px auto 26px;letter-spacing:.04em}
.t4 .h2 em{font-style:normal;color:var(--foil)}
.t4 .word{font:700 15vw/.95 Syncopate,sans-serif;text-transform:uppercase;color:var(--foil);display:block;margin-bottom:20px}
.t4 .name{font:400 15px/1.4 Syncopate,sans-serif;letter-spacing:.14em;text-transform:uppercase}
.t4 .h3{font:700 7vw/1.2 Syncopate,sans-serif;text-transform:uppercase;margin:14px auto 30px}.t4 .h3 em{font-style:normal;color:var(--foil)}
@media (min-width:900px){.t4 .h1{font-size:5.4vw}.t4 .h2{font-size:2.4vw}.t4 .word{font-size:7vw}.t4 .name{font-size:17px}.t4 .h3{font-size:3vw}}

/* ---------- 5. Editorial: a sharp display serif with its italic, mixed case ---------- */
.t5 .h1{font:400 17vw/.92 Gloock,serif;letter-spacing:-.02em}
.t5 .h1 em{font:italic 400 1em "Instrument Serif",serif;color:var(--foil)}
.t5 .h2{font:400 10vw/1.05 Gloock,serif;max-width:16ch;margin:18px auto 26px}
.t5 .h2 em{font:italic 400 1em "Instrument Serif",serif;color:var(--foil)}
.t5 .word{font:italic 400 26vw/.82 "Instrument Serif",serif;color:var(--foil);display:block;margin-bottom:10px}
.t5 .name{font:400 26px/1.15 Gloock,serif}
.t5 .h3{font:400 11vw/1.02 Gloock,serif;margin:14px auto 30px}.t5 .h3 em{font:italic 400 1em "Instrument Serif",serif;color:var(--foil)}
@media (min-width:900px){.t5 .h1{font-size:8.2vw}.t5 .h2{font-size:4.6vw}.t5 .word{font-size:12vw}.t5 .name{font-size:36px}.t5 .h3{font-size:5vw}}

/* footer: a greeting in Arabic, then one row of links (approved) */
.sfoot{padding:64px 20px 28px;background:#15110d;color:#efe6d6;font:400 15px/1.6 Jost,system-ui,sans-serif}
.sfoot .bye{display:flex;align-items:baseline;gap:6px 16px;flex-wrap:wrap}
.sfoot .ar{font:700 44px/1.4 "Aref Ruqaa",serif;color:#e2b43c;direction:rtl}
.sfoot .en{font:400 18px Marcellus,serif;letter-spacing:.24em;text-transform:uppercase}
.sfoot .row{display:grid;gap:18px;margin-top:22px}
.sfoot nav{display:flex;flex-wrap:wrap;gap:0 24px}
.sfoot nav a{color:inherit;text-decoration:none;display:inline-flex;min-height:44px;align-items:center;transition:color .2s}
.sfoot nav a:hover{color:#e2b43c}
.sfoot .legal{font-size:13px;color:#c3b7a2}
@media (min-width:900px){.sfoot{padding:80px clamp(32px,5vw,80px) 34px}.sfoot .ar{font-size:64px}.sfoot .row{grid-template-columns:1fr auto;align-items:end}}
</style></head>
<body><div id="root"></div>
<footer class="sfoot">
  <div class="bye"><span class="ar" lang="ar">السلام عليكم</span><span class="en">Peace be upon you</span></div>
  <div class="row">
    <nav aria-label="Footer"><a href="catalog.html">Collections</a><a href="our-story.html">Our story</a><a href="wholesale.html">Wholesale</a><a href="visit.html">Visit</a><a href="https://wa.me/66895042876?text=Hello%20Aminar" target="_blank" rel="noopener">WhatsApp</a><a href="https://instagram.com/aminarthailand" target="_blank" rel="noopener">Instagram</a></nav>
    <p class="legal">© 2026 Aminar · Sukhumvit Soi 3, Bangkok</p>
  </div>
</footer>
<script>
const I = 'images/story/';
const t = '3';
document.body.className = 't' + t;
const P1 = 'For more than three decades, Aminar Thailand has been devoted to the art of fragrance. What began in Bangkok in 1993 has grown into a house shaped by Thai craftsmanship, honest sourcing and an enduring pursuit of quality.';
const P2 = 'From carefully selected ingredients to every finished creation, our fragrances unite tradition with modern refinement, and carry the character of Aminar into everything we make.';
const C = [
  {img: 'craft-selection.jpg', name: 'Thoughtful selection', verb: 'Select', lower: 'select.', ar: 'الاختيار', p: 'We carefully select fragrance materials and oud for their character, quality and authenticity, and build every creation on a foundation we trust.'},
  {img: 'craft-blending.jpg', name: 'Crafted by experience', verb: 'Blend', lower: 'blend.', ar: 'المزج', p: 'Guided by more than three decades of experience, each composition is blended with patience, precision and a deep understanding of scent.'},
  {img: 'craft-finished.jpg', name: 'Made to be remembered', verb: 'Remain', lower: 'remain.', ar: 'الأثر', p: 'Every fragrance is refined for balance and presence. Our perfumes stay 10 to 12 hours on skin; our sprays for clothes, up to 48 hours on fabric.'},
];
const T = {
  0: {h1: '<span class="a">The art</span><span class="b">behind</span><span class="c">every scent</span>', h2: 'A heritage <em>crafted in scent</em>', h3: 'Find your <em>signature scent</em>', word: (c) => c.verb},
  1: {h1: 'the art<br>behind <em>every<br>scent</em>', h2: 'a heritage <em>crafted in scent</em>', h3: 'find your <em>signature</em>', word: (c) => c.lower},
  2: {h1: 'The art behind<br><em>every scent</em>', h2: 'A heritage <em>crafted in scent</em>', h3: 'Find your <em>signature scent</em>', word: (c) => c.verb},
  3: {h1: '<span class="ar" lang="ar">عطر</span><span class="en">The art behind every scent</span>', h2: '<span class="ar" lang="ar">إرث</span>A heritage <em>crafted in scent</em>', h3: '<span class="ar" lang="ar">عود</span>Find your <em>signature scent</em>', word: (c) => `<span lang="ar">${c.ar}</span>`},
  4: {h1: 'The art<br>behind<br><em>every scent</em>', h2: 'A heritage <em>crafted in scent</em>', h3: 'Find your <em>signature scent</em>', word: (c) => c.verb},
  5: {h1: 'The art behind <em>every scent</em>', h2: 'A heritage <em>crafted in scent</em>', h3: 'Find your <em>signature scent</em>', word: (c) => c.verb.toLowerCase()},
}[t];
const ar = t === '3' ? ' ar' : '';
document.getElementById('root').innerHTML = `<nav class="nav" aria-label="Main"><a class="back" href="index.html">← Home</a><a href="index.html"><img src="logo/aminar-logo-gold.svg" alt="Aminar home"></a><a class="back" href="catalog.html">Collections</a></nav>
  <section class="hero"><img src="${I}black-bottle.jpg" alt=""><div class="t"><p class="kicker" style="margin-bottom:14px">Our story · Since 1993</p><h1 class="h1">${T.h1}</h1></div></section>
  <section class="her m"><p class="kicker">Bangkok, 1993</p><h2 class="h2">${T.h2}</h2><p class="p">${P1}</p><p class="p">${P2}</p></section>
  <div class="panels">${C.map((c) => `<section class="panel"><img src="${I}${c.img}" alt=""><div class="t"><span class="word${ar}">${T.word(c)}</span><h3 class="name">${c.name}</h3><p class="p" style="margin:12px 0 0">${c.p}</p></div></section>`).join('')}</div>
  <section class="close"><p class="kicker">Visit us in Bangkok</p><h2 class="h3">${T.h3}</h2><a class="btn" href="catalog.html" style="text-decoration:none">Explore the collections →</a></section>`;

document.querySelectorAll('.h1,.h2,.h3,.word,.name,.p,.panel > img').forEach((el) => el.setAttribute('data-rise', ''));
const io = new IntersectionObserver((es) => es.forEach((e) => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } }), {rootMargin: '0px 0px -8% 0px'});
document.querySelectorAll('[data-rise]').forEach((el) => io.observe(el));
</script>
</body></html>
